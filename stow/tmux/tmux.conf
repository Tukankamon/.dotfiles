set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

unbind C-b
set -g prefix º # Left of 1 on the spanish keyboard
bind º send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes are in current dir
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

unbind -n C-h

# Kill window <prefix> q
bind q killp

# bar
set -g status-style bg=default,fg=white,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

set -g window-status-format " #I[#W] "
set -g window-status-current-format " #I[#W] "
set -g window-status-bell-style "bg=red,nobold"
set -g window-status-current-style fg=cyan,bold

# qol
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 1000
